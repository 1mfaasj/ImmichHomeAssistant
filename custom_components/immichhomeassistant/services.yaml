next_image:
  target:
    entity:
      integration: immichhomeassistant
      domain: image

set_shuffle_mode:
  target:
    entity:
      integration: immichhomeassistant
      domain: image
  fields:
    enabled:
      required: true
      selector:
        boolean:

set_random_speed:
  target:
    entity:
      integration: immichhomeassistant
      domain: image
  fields:
    enabled:
      required: true
      selector:
        boolean:

set_refresh_interval:
  target:
    entity:
      integration: immichhomeassistant
      domain: image
  fields:
    seconds:
      required: true
      selector:
        number:
          min: 10
          max: 3600
          step: 1
          mode: box
          unit_of_measurement: s
