next_image:
  name: Volgende afbeelding
  description: Wissel direct naar de volgende afbeelding voor één of meer image-entiteiten.
  fields:
    entity_id:
      name: Image entiteit
      required: false
      selector:
        entity:
          multiple: true
          filter:
            domain: image
set_shuffle_mode:
  name: Shuffle-modus instellen
  description: Zet shuffle-modus aan of uit.
  fields:
    entity_id:
      name: Image entiteit
      required: false
      selector:
        entity:
          multiple: true
          filter:
            domain: image
    enabled:
      name: Ingeschakeld
      required: true
      selector:
        boolean:
set_random_speed:
  name: Willekeurige slideshowsnelheid instellen
  description: Zet willekeurige slideshowsnelheid aan of uit.
  fields:
    entity_id:
      name: Image entiteit
      required: false
      selector:
        entity:
          multiple: true
          filter:
            domain: image
    enabled:
      name: Ingeschakeld
      required: true
      selector:
        boolean:
set_refresh_interval:
  name: Verversinterval instellen
  description: Stel het verversinterval in seconden in.
  fields:
    entity_id:
      name: Image entiteit
      required: false
      selector:
        entity:
          multiple: true
          filter:
            domain: image
    seconds:
      name: Seconden
      required: true
      selector:
        number:
          min: 10
          max: 3600
          mode: box
          unit_of_measurement: s
